<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100 Days Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Anton&family=Oswald:wght@700&family=Bangers&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#0a0820;--ink:#f1eeff;--mut:#9b95c9;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--cell:rgba(255,255,255,.05);
--a1:#8b5cff;--a2:#22d3ee;--a3:#ff5ea8;--blob:.55;--disp:Syne}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f0ff;--ink:#1c1640;--mut:#665f99;--glass:rgba(255,255,255,.7);--line:rgba(60,40,140,.16);--cell:rgba(60,40,140,.06);--blob:.3}}
:root[data-theme="light"]{--bg:#f3f0ff;--ink:#1c1640;--mut:#665f99;--glass:rgba(255,255,255,.7);--line:rgba(60,40,140,.16);--cell:rgba(60,40,140,.06);--blob:.3}
:root[data-theme="dark"]{--bg:#0a0820;--ink:#f1eeff;--mut:#9b95c9;--glass:rgba(255,255,255,.06);--line:rgba(255,255,255,.12);--cell:rgba(255,255,255,.05);--blob:.55}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.blob{position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:var(--blob);z-index:0;pointer-events:none;animation:drift 22s ease-in-out infinite alternate}
.b1{background:var(--a1);top:-25vmax;left:-15vmax}.b2{background:var(--a3);bottom:-30vmax;right:-20vmax;animation-delay:-8s}.b3{background:var(--a2);width:35vmax;height:35vmax;top:30%;left:45%;opacity:calc(var(--blob)*.5);animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
main{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:28px 18px 60px;display:grid;gap:22px}
@media(min-width:960px){main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.left{position:sticky;top:20px}}
.glass{background:var(--glass);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.hero{padding:26px 26px 22px;position:relative;overflow:hidden}
.big{font:800 clamp(88px,19vw,168px)/.85 var(--disp),sans-serif;letter-spacing:-.05em;margin:0;background:linear-gradient(100deg,var(--a2),var(--a1) 40%,var(--a3) 80%,var(--a2));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 7s linear infinite}
@keyframes sheen{to{background-position:-250% 0}}
.sub{font:700 clamp(18px,3vw,24px)/1.2 var(--disp),sans-serif;margin:8px 0 0}
.mut{color:var(--mut)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:18px}
.ring{width:96px;height:96px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .t{stroke:var(--cell)}.ring .p{stroke:url(#g);transition:stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 0 6px var(--a1))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 22px var(--disp),sans-serif}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;min-width:230px}
.stat{background:var(--cell);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
.stat b{display:block;font:800 24px/1.1 var(--disp),sans-serif}.stat span{font-size:12.5px;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;padding:18px}
.d{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:color-mix(in srgb,var(--a1) calc(var(--h)*100%),var(--cell));color:var(--ink);font:700 clamp(10px,1.6vw,13px) Manrope,sans-serif;cursor:pointer;padding:0;transition:transform .15s,box-shadow .3s;box-shadow:0 0 calc(var(--h)*16px) color-mix(in srgb,var(--a2) calc(var(--h)*80%),transparent)}
.d:hover{transform:scale(1.14)}
.d.full{background:linear-gradient(135deg,var(--a2),var(--a1) 55%,var(--a3));color:#fff;border-color:transparent}
.d.today{outline:2px dashed var(--a2);outline-offset:2px}
.d.sel{outline:2px solid var(--ink);outline-offset:2px}
.d:focus-visible,.tab:focus-visible,.item:focus-within,.btn:focus-visible{outline:3px solid var(--a2);outline-offset:2px}
.panel{padding:22px}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
h2{font:800 26px/1.1 var(--disp),sans-serif;margin:0}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:16px 0 6px;scrollbar-width:none}
.tab{flex:none;border:1px solid var(--line);background:var(--cell);color:var(--ink);padding:8px 14px;border-radius:99px;font:700 13.5px Manrope,sans-serif;cursor:pointer}
.tab[aria-pressed=true]{background:var(--c);border-color:transparent;color:#fff;box-shadow:0 0 18px -2px var(--c)}
.list{display:grid;gap:8px;margin-top:10px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--cell);cursor:pointer;transition:background .2s,transform .15s;position:relative}
.item:hover{transform:translateX(3px)}
.item input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.box{width:24px;height:24px;border-radius:8px;border:2px solid var(--c);flex:none;display:grid;place-items:center;transition:all .25s}
.box svg{width:15px;height:15px;stroke:#fff;stroke-width:3.5;fill:none;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .3s}
.item.on{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:var(--c)}
.item.on .box{background:var(--c);box-shadow:0 0 14px var(--c)}
.item.on .box svg{stroke-dashoffset:0}
.item.on .tx{text-decoration:line-through;text-decoration-color:var(--mut);color:var(--mut)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--cell);color:var(--ink);padding:9px 14px;border-radius:12px;font:700 13px Manrope,sans-serif;cursor:pointer}
.btn:hover{background:var(--line)}

body{font-synthesis:none}
body::before{content:"";position:fixed;inset:-200px;z-index:0;pointer-events:none}
.emb{position:absolute;right:20px;top:20px;width:96px;height:96px;fill:none;stroke:var(--a2);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 10px var(--a2));animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07) rotate(-3deg)}}
.motto{font:700 17px/1.3 var(--disp),sans-serif;margin:6px 0 0;letter-spacing:.02em}
.skins{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.d.full{text-shadow:0 1px 3px rgba(0,0,0,.6)}
:root[data-skin="lee"]{--bg:#07140b;--ink:#effff2;--mut:#86b595;--glass:rgba(34,197,94,.07);--line:rgba(74,222,128,.24);--cell:rgba(255,255,255,.05);--a1:#22c55e;--a2:#fb923c;--a3:#facc15;--blob:.38;--disp:Anton}
:root[data-skin="lee"] body::before{background:repeating-linear-gradient(115deg,transparent 0 46px,rgba(251,146,60,.1) 46px 50px);animation:rush 1.4s linear infinite}
@keyframes rush{to{transform:translate(45.3px,21.1px)}}
:root[data-skin="toji"]{--bg:#09090b;--ink:#f4f4f5;--mut:#9a9aa6;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.15);--cell:rgba(255,255,255,.05);--a1:#dc2626;--a2:#94a3b8;--a3:#fb7185;--blob:.3;--disp:Oswald}
:root[data-skin="toji"] body::before{inset:0;background:radial-gradient(ellipse at 50% 40%,transparent 35%,rgba(0,0,0,.75)),linear-gradient(62deg,transparent 49.8%,rgba(220,38,38,.6) 50%,transparent 50.25%),linear-gradient(62deg,transparent 58%,rgba(148,163,184,.25) 58.1%,transparent 58.25%);animation:flash 5s ease-in-out infinite}
@keyframes flash{50%{opacity:.35}}
:root[data-skin="garou"]{--bg:#0c0610;--ink:#fdf2f8;--mut:#b490b6;--glass:rgba(255,255,255,.055);--line:rgba(255,120,150,.2);--cell:rgba(255,255,255,.05);--a1:#ff2e4d;--a2:#f1f5f9;--a3:#ff8a3d;--blob:.42;--disp:Bangers}
:root[data-skin="garou"] body::before{inset:0;background:linear-gradient(72deg,transparent 24.8%,rgba(255,46,77,.55) 25%,transparent 25.4%),linear-gradient(72deg,transparent 33.8%,rgba(255,46,77,.45) 34%,transparent 34.5%),linear-gradient(72deg,transparent 43.8%,rgba(255,138,61,.4) 44%,transparent 44.4%);animation:flash 4s ease-in-out infinite}
:root[data-skin="garou"] .big,:root[data-skin="lee"] .big,:root[data-skin="toji"] .big{letter-spacing:0}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<main>
<section class="left">
  <div class="glass hero">
    <svg class="emb" id="emb" viewBox="0 0 100 100" aria-hidden="true"></svg>
    <h1 class="big" id="big">100</h1>
    <p class="sub" id="sub"></p>
    <p class="motto mut" id="motto"></p>
    <div class="skins" id="skins" role="group" aria-label="Choose a theme"></div>
    <div class="row">
      <div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="g"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#ff5ea8"/></linearGradient></defs><circle class="t" cx="50" cy="50" r="42"/><circle class="p" id="ring" cx="50" cy="50" r="42" stroke-dasharray="264" stroke-dashoffset="264"/></svg><b id="pct">0%</b></div>
      <div class="stats">
        <div class="stat"><b id="streak">0</b><span>day streak</span></div>
        <div class="stat"><b id="perfect">0</b><span>perfect days</span></div>
        <div class="stat"><b id="total">0</b><span>of 5,500 ticks</span></div>
      </div>
    </div>
  </div>
  <div class="glass grid" id="grid" style="margin-top:22px" role="group" aria-label="100 days"></div>
</section>
<section class="glass panel">
  <div class="head"><h2 id="dayTitle">Day 1</h2><span class="mut" id="dayCount"></span></div>
  <div class="tabs" id="tabs"></div>
  <div class="list" id="list"></div>
  <div class="btns">
    <button class="btn" id="all">Tick this category</button>
    <button class="btn" id="none">Clear this day</button>
    <button class="btn" id="theme">Switch theme</button>
    <button class="btn" id="reset">Restart challenge</button>
  </div>
</section>
</main>
<script>
const CATS=[
{n:'Code',c:'#8b5cff',a:['Solve 1 DSA problem','Solve 3 problems in a row','Join a live contest','Upsolve a failed problem','Implement a data structure from scratch','Write a C++ program with no IDE hints','Read a contest editorial','Do a 45-minute timed mock','Debug an old wrong answer','Learn one STL internal','Review yesterday\'s code']},
{n:'Study',c:'#22d3ee',a:['Attend every class','Revise lecture notes','Solve 10 math problems','Do a probability exercise','Watch one lecture','Explain a concept out loud','Review flashcards','Do one ML lesson','Clear one doubt','Read one paper or deep blog','Take a weekly mock test']},
{n:'Build',c:'#ff5ea8',a:['Push a GitHub commit','Work on a side project for 1 hour','Write a README','Read one system design article','Draw an architecture diagram','Learn a Linux command','Write unit tests','Read open-source code','Share what I learned','Refactor old code','Ship one small feature']},
{n:'Body',c:'#34d399',a:['Work out for 30 minutes','Walk 10,000 steps','Sleep before 11 pm','Sleep 7+ hours','Drink 3 litres of water','Stretch for 10 minutes','Skip junk food','Get morning sunlight','Take a walk after a meal','Check my posture','Take a cold shower']},
{n:'Mind',c:'#fbbf24',a:['Read 20 pages','Meditate for 5 minutes','Write a journal entry','No social media for 2 hours','Phone out of the bedroom','Plan tomorrow tonight','Write 3 gratitudes','Do 2 hours of deep work','Learn a new word','Screens off 1 hour before bed','Do a weekly review']}
];
const PER=11,N=55,DAY=864e5;
const el=id=>document.getElementById(id);
let S={start:null,done:{}},sel=1,cat=0;
function load(){try{const r=localStorage.getItem('c100');if(r)S=JSON.parse(r)}catch(e){}
 if(!S.start){const d=new Date();d.setHours(0,0,0,0);S.start=d.getTime()}}
function save(){try{localStorage.setItem('c100',JSON.stringify(S))}catch(e){}}
const today=()=>Math.min(100,Math.max(1,Math.floor((Date.now()-S.start)/DAY)+1));
const cnt=d=>(S.done[d]||[]).length;
function render(){
 const t=today(),c=cnt(sel);
 el('sub').textContent='Day '+t+' of 100';
 el('dayTitle').textContent='Day '+sel+(sel===t?' (today)':'');
 el('dayCount').textContent=c+' / '+N+' done';
 el('ring').style.strokeDashoffset=264*(1-c/N);
 el('pct').textContent=Math.round(c/N*100)+'%';
 let tot=0,perf=0;for(let d=1;d<=100;d++){const k=cnt(d);tot+=k;if(k===N)perf++}
 let st=0,d=t;if(!cnt(d))d--;while(d>=1&&cnt(d)){st++;d--}
 el('streak').textContent=st;el('perfect').textContent=perf;el('total').textContent=tot.toLocaleString();
 el('grid').innerHTML=Array.from({length:100},(_,i)=>{const n=i+1,k=cnt(n);
  return `<button class="d${k===N?' full':''}${n===t?' today':''}${n===sel?' sel':''}" style="--h:${(k/N).toFixed(2)}" data-d="${n}" aria-label="Day ${n}, ${k} of ${N} done">${n}</button>`}).join('');
 el('tabs').innerHTML=CATS.map((x,i)=>{const done=(S.done[sel]||[]).filter(id=>Math.floor(id/PER)===i).length;
  return `<button class="tab" style="--c:${x.c}" aria-pressed="${i===cat}" data-c="${i}">${x.n} ${done}/${PER}</button>`}).join('');
 const C=CATS[cat],set=S.done[sel]||[];
 el('list').innerHTML=C.a.map((a,i)=>{const id=cat*PER+i,on=set.includes(id);
  return `<label class="item${on?' on':''}" style="--c:${C.c}"><input type="checkbox" data-i="${id}"${on?' checked':''}><span class="box"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span><span class="tx">${a}</span></label>`}).join('');
}
function toggle(id){const s=new Set(S.done[sel]||[]);s.has(id)?s.delete(id):s.add(id);S.done[sel]=[...s];save();render()}
el('grid').onclick=e=>{const b=e.target.closest('.d');if(b){sel=+b.dataset.d;render()}};
el('tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){cat=+b.dataset.c;render()}};
el('list').onchange=e=>toggle(+e.target.dataset.i);
el('all').onclick=()=>{const s=new Set(S.done[sel]||[]);for(let i=0;i<PER;i++)s.add(cat*PER+i);S.done[sel]=[...s];save();render()};
el('none').onclick=()=>{S.done[sel]=[];save();render()};
el('theme').onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
let armed=0;el('reset').onclick=function(){if(!armed){armed=1;this.textContent='Click again to erase everything';setTimeout(()=>{armed=0;this.textContent='Restart challenge'},3000);return}
 armed=0;this.textContent='Restart challenge';S={start:null,done:{}};load();save();sel=1;applySkin();render()};
const SK=[
{k:'',n:'Aurora',m:'55 activities. 100 days. Tick what you did, watch the grid light up.',e:''},
{k:'lee',n:'Hard Work',m:'No shortcuts. Outwork everyone, one more rep.',e:'<rect x="24" y="28" width="50" height="34" rx="10"/><path d="M37 28v16M49 28v16M61 28v16M30 62v18h38V62M30 69h38M30 75h38M8 36h10M6 48h12M8 60h10"/>'},
{k:'toji',n:'Pure Body',m:'No tricks. Just a body trained past its limits.',e:'<path d="M18 82L78 22M82 82L22 22"/><path d="M70 16l14 14M30 16L16 30M14 86l8-8M86 86l-8-8"/><path d="M40 60l20 0" opacity=".5"/>'},
{k:'garou',n:'Lone Beast',m:'Be the monster that never stops getting stronger.',e:'<path d="M26 10q22 38 8 82M48 8q22 42 8 86M70 12q18 38 6 76"/><circle cx="80" cy="22" r="3" fill="currentColor"/>'}];
function applySkin(){const k=S.skin||'';document.documentElement.dataset.skin=k;const s=SK.find(x=>x.k===k)||SK[0];
 el('motto').textContent=s.m;el('emb').innerHTML=s.e;
 el('skins').innerHTML=SK.map(x=>`<button class="tab sk" style="--c:var(--a1)" aria-pressed="${x.k===k}" data-k="${x.k}">${x.n}</button>`).join('')}
el('skins').onclick=e=>{const b=e.target.closest('.sk');if(b){S.skin=b.dataset.k;save();applySkin()}};
load();sel=today();applySkin();render();
</script>
</body>
</html>
